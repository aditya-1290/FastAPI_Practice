<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard | Support System</title>
    <link rel="stylesheet" href="/static/shared_dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <!-- Sidebar -->
        <aside class="dashboard-sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-headset"></i>
                    <h1>Support Portal</h1>
                </div>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li>
                        <a href="/dashboard" class="active">
                            <i class="fas fa-tachometer-alt"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="/dashboard/my_tickets">
                            <i class="fas fa-ticket-alt"></i>
                            <span>My Tickets</span>
                            <span class="badge" id="ticket-count">0</span>
                        </a>
                    </li>
                    <li>
                        <a href="/dashboard/knowledge_base">
                            <i class="fas fa-book"></i>
                            <span>Knowledge Base</span>
                        </a>
                    </li>
                    <li>
                        <a href="/dashboard/settings">
                            <i class="fas fa-cog"></i>
                            <span>Settings</span>
                        </a>
                    </li>
                </ul>
        </aside>

        <!-- Main Content -->
        <div class="dashboard-main">
            <!-- Top Navigation -->
            <header class="dashboard-header">
                <div class="header-left">
                    <button class="sidebar-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h2>My Support Dashboard</h2>
                </div>
                <div class="header-right">
                    <div class="user-menu">
                        <div class="user-info">
                            <span class="user-name">{{ user.name }}</span>
                            <span class="user-role">Customer</span>
                        </div>
                        <div class="user-avatar">
                            <i class="fas fa-user-circle"></i>
                        </div>
                        <div class="dropdown-menu">
                            <a href="/profile"><i class="fas fa-user-cog"></i> Profile</a>
                            <a href="/logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Main Content Area -->
            <main class="dashboard-content">
                <section class="new-ticket-section">
                    <div class="section-header">
                        <h3><i class="fas fa-plus-circle"></i> Create New Ticket</h3>
                    </div>
                    <form id="ticketForm" class="ticket-form" method="post" action="dashboard/create_ticket" enctype="multipart/form-data">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="subject"><i class="fas fa-heading"></i> Subject</label>
                                <input type="text" id="subject" name="subject" required placeholder="Briefly describe your issue">
                            </div>
                            <div class="form-group">
                                <label for="category"><i class="fas fa-tag"></i> Category</label>
                                <select id="category" name="category">
                                    <option value="general">General Inquiry</option>
                                    <option value="technical">Technical Issue</option>
                                    <option value="billing">Billing Question</option>
                                    <option value="feature">Feature Request</option>
                                    <option value="feature">Other Request</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="description"><i class="fas fa-align-left"></i> Description</label>
                            <textarea id="description" name="description" required placeholder="Please provide detailed information about your issue"></textarea>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="priority"><i class="fas fa-exclamation-circle"></i> Priority</label>
                                <select id="priority" name="priority">
                                    <option value="low">Low</option>                                                                                                                                  
                                    <option value="medium" selected>Medium</option>
                                    <option value="high">High</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="attachments"><i class="fas fa-paperclip"></i> Attachments</label>
                                <input type="file" id="attachments" name="attachments" multiple>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-paper-plane"></i> Submit Ticket
                        </button>
                    </form>
                </section>

                <section class="tickets-section">
                    <div class="section-header">
                        <h3><i class="fas fa-ticket-alt"></i> My Tickets</h3>
                        <div class="section-actions">
                            <div class="filter-group">
                                <select id="statusFilter">
                                    <option value="">All Statuses</option>
                                    <option value="open">Open</option>
                                    <option value="in_progress">In Progress</option>
                                    <option value="closed">Closed</option>
                                </select>
                                <select id="priorityFilter">
                                    <option value="">All Priorities</option>
                                    <option value="low">Low</option>
                                    <option value="medium">Medium</option>
                                    <option value="high">High</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="tickets-list" id="tickets">
                        <!-- Tickets will be loaded here via JavaScript -->
                    </div>
                    <div class="pagination">
                        <button id="prevPage" disabled><i class="fas fa-chevron-left"></i> Previous</button>
                        <span id="pageInfo">Page 1 of 1</span>
                        <button id="nextPage" disabled>Next <i class="fas fa-chevron-right"></i></button>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="/static/dashboard.js"></script>
    <script>
        // Toggle sidebar on mobile
        document.querySelector('.sidebar-toggle').addEventListener('click', function() {
            document.querySelector('.dashboard-wrapper').classList.toggle('sidebar-collapsed');
        });

        // Toggle user dropdown
        document.querySelector('.user-avatar').addEventListener('click', function() {
            document.querySelector('.dropdown-menu').classList.toggle('show');
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', function(event) {
            if (!event.target.closest('.user-menu')) {
                document.querySelector('.dropdown-menu').classList.remove('show');
            }
        });
    </script>
</body>
</html>
