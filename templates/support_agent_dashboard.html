<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Agent Dashboard | Support System</title>
    <link rel="stylesheet" href="/static/shared_dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <!-- Sidebar -->
        <aside class="dashboard-sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-headset"></i>
                    <h1>Support Portal</h1>
                </div>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li>
                        <a href="/dashboard" class="active">
                            <i class="fas fa-tachometer-alt"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="/tickets">
                            <i class="fas fa-ticket-alt"></i>
                            <span>Tickets</span>
                            <span class="badge" id="ticket-count">0</span>
                        </a>
                    </li>
                    <li>
                        <a href="/customers">
                            <i class="fas fa-users"></i>
                            <span>Customers</span>
                        </a>
                    </li>
                    <li>
                        <a href="/knowledge_base">
                            <i class="fas fa-book"></i>
                            <span>Knowledge Base</span>
                        </a>
                    </li>
                    <li>
                        <a href="/reports">
                            <i class="fas fa-chart-bar"></i>
                            <span>Reports</span>
                        </a>
                    </li>
                </ul>
        </aside>

        <!-- Main Content -->
        <div class="dashboard-main">
            <!-- Top Navigation -->
            <header class="dashboard-header">
                <div class="header-left">
                    <button class="sidebar-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h2>Ticket Dashboard</h2>
                </div>
                <div class="header-right">
                    <div class="user-menu">
                        <div class="user-info">
                            <span class="user-name">{{ user.name }}</span>
                            <span class="user-role">Support Agent</span>
                        </div>
                        <div class="user-avatar">
                            <i class="fas fa-user-circle"></i>
                        </div>
                        <div class="dropdown-menu">
                            <a href="/profile"><i class="fas fa-user-cog"></i> Profile</a>
                            <a href="/logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Main Content Area -->
            <main class="dashboard-content">
                <div class="stats-cards">
                    <div class="stat-card">
                        <div class="stat-icon open">
                            <i class="fas fa-door-open"></i>
                        </div>
                        <div class="stat-info">
                            <span class="stat-number" id="open-tickets">0</span>
                            <span class="stat-label">Open Tickets</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon in-progress">
                            <i class="fas fa-spinner"></i>
                        </div>
                        <div class="stat-info">
                            <span class="stat-number" id="in-progress-tickets">0</span>
                            <span class="stat-label">In Progress</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon overdue">
                            <i class="fas fa-clock"></i>
                        </div>
                        <div class="stat-info">
                            <span class="stat-number" id="overdue-tickets">0</span>
                            <span class="stat-label">Overdue</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon resolved">
                            <i class="fas fa-check-circle"></i>
                        </div>
                        <div class="stat-info">
                            <span class="stat-number" id="resolved-tickets">0</span>
                            <span class="stat-label">Resolved Today</span>
                        </div>
                    </div>
                </div>

                <section class="tickets-section">
                    <div class="section-header">
                        <h3><i class="fas fa-ticket-alt"></i> Recent Tickets</h3>
                        <div class="section-actions">
                            <div class="search-box">
                                <i class="fas fa-search"></i>
                                <input type="text" placeholder="Search tickets...">
                            </div>
                            <div class="filter-group">
                                <select id="statusFilter">
                                    <option value="">All Statuses</option>
                                    <option value="open">Open</option>
                                    <option value="in_progress">In Progress</option>
                                    <option value="on_hold">On Hold</option>
                                    <option value="closed">Closed</option>
                                </select>
                                <select id="priorityFilter">
                                    <option value="">All Priorities</option>
                                    <option value="low">Low</option>
                                    <option value="medium">Medium</option>
                                    <option value="high">High</option>
                                    <option value="critical">Critical</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="tickets-list" id="tickets">
                        <!-- Tickets will be loaded here via JavaScript -->
                    </div>
                    <div class="pagination">
                        <button id="prevPage" disabled><i class="fas fa-chevron-left"></i> Previous</button>
                        <span id="pageInfo">Page 1 of 1</span>
                        <button id="nextPage" disabled>Next <i class="fas fa-chevron-right"></i></button>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="/static/dashboard.js"></script>
    <script>
        // Toggle sidebar on mobile
        document.querySelector('.sidebar-toggle').addEventListener('click', function() {
            document.querySelector('.dashboard-wrapper').classList.toggle('sidebar-collapsed');
        });

        // Toggle user dropdown
        document.querySelector('.user-avatar').addEventListener('click', function() {
            document.querySelector('.dropdown-menu').classList.toggle('show');
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', function(event) {
            if (!event.target.closest('.user-menu')) {
                document.querySelector('.dropdown-menu').classList.remove('show');
            }
        });
    </script>
</body>
</html>
