<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Knowledge Base</title>
</head>
<body>
    <h1>Knowledge Base</h1>
    <ul>
    {% for article in articles %}
        <li>
            <strong>{{ article.title }}</strong><br />
            {{ article.summary }}<br />
            <a href="/knowledge_base/{{ article.id }}">Read More</a>
        </li>
    {% else %}
        <li>No articles found.</li>
    {% endfor %}
    </ul>
</body>
</html>
